const SB_URL='https://fpglnulblraiviiypaeq.supabase.co',SB_KEY='sb_publishable_-XHUDFaDuyjN3UEto0bdwQ_amS0Ym1I',VN='https://giadinhsumhop.github.io/Viec-nha/';

const ST={a:'Tất cả',l:'Lý thuyết',c:'Tính toán'};
let qt='a',qn=10,qi=0,sc=0,qs=[],qrun=false,curTest=null;
/* ===== Bài học ===== */
const LS=[
['🧩','Hằng đẳng thức và phân tích đa thức',8,`<ul><li>(a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; <b>a² − b² = (a − b)(a + b)</b>.</li><li>(a + b)³ = a³ + 3a²b + 3ab² + b³; a³ + b³ = (a + b)(a² − ab + b²); a³ − b³ = (a − b)(a² + ab + b²).</li><li><b>Phân tích thành nhân tử:</b> đặt nhân tử chung, dùng hằng đẳng thức, nhóm hạng tử. Ví dụ: x² − 9 = (x − 3)(x + 3).</li></ul><p class="tip">💡 Phân tích xong, hãy nhân lại để kiểm tra kết quả.</p>`],
['➗','Phân thức đại số',8,`<ul><li>Phân thức A/B có nghĩa khi <b>B ≠ 0</b> (điều kiện xác định).</li><li><b>Rút gọn:</b> phân tích tử và mẫu thành nhân tử, rồi triệt tiêu nhân tử chung.</li><li>Cộng, trừ: quy đồng mẫu. Nhân: tử nhân tử, mẫu nhân mẫu. Chia: nhân với phân thức nghịch đảo.</li></ul><p class="tip">💡 Luôn đặt điều kiện xác định trước khi rút gọn.</p>`],
['📈','Hàm số bậc nhất y = ax + b',8,`<ul><li>Hàm số y = ax + b (a ≠ 0): a &gt; 0 đồng biến, a &lt; 0 nghịch biến. a là <b>hệ số góc</b>.</li><li>Đồ thị là đường thẳng cắt Oy tại (0; b), cắt Ox tại (−b/a; 0).</li><li>Hai đường thẳng y = ax + b và y = a₂x + b₂: <b>song song</b> khi a = a₂ và b ≠ b₂; <b>cắt nhau</b> khi a ≠ a₂; <b>trùng nhau</b> khi a = a₂ và b = b₂; <b>vuông góc</b> khi a·a₂ = −1.</li></ul><p class="tip">💡 Thử vẽ đồ thị ở tab Thực hành, công cụ B.</p>`],
['⚖️','Phương trình và bất phương trình bậc nhất',8,`<ul><li>ax + b = 0 (a ≠ 0) có nghiệm x = −b/a.</li><li><b>Phương trình tích:</b> A·B = 0 ⇔ A = 0 hoặc B = 0.</li><li><b>Giải bài toán bằng cách lập phương trình:</b> chọn ẩn và đặt điều kiện → biểu diễn các đại lượng → lập phương trình → giải → đối chiếu điều kiện.</li><li><b>Bất phương trình:</b> khi nhân hoặc chia hai vế với số âm thì <b>đổi chiều</b>. Ví dụ −2x &gt; 6 ⇔ x &lt; −3.</li></ul>`],
['📐','Định lí Pythagore và tứ giác',8,`<ul><li><b>Pythagore:</b> tam giác vuông có a² + b² = c² (c là cạnh huyền). Định lí đảo cũng đúng.</li><li><b>Hình bình hành:</b> hai cặp cạnh đối song song; hai đường chéo cắt nhau tại trung điểm.</li><li><b>Hình chữ nhật:</b> bốn góc vuông; hai đường chéo bằng nhau. <b>Hình thoi:</b> bốn cạnh bằng nhau; hai đường chéo vuông góc.</li><li><b>Hình vuông</b> vừa là hình chữ nhật vừa là hình thoi.</li></ul><p class="tip">💡 Bộ ba hay gặp: (3; 4; 5), (5; 12; 13), (8; 15; 17).</p>`],
['🔺','Định lí Thalès và tam giác đồng dạng',8,`<ul><li><b>Thalès:</b> DE ∥ BC thì AD/AB = AE/AC = DE/BC. Định lí đảo cũng đúng.</li><li><b>Đường phân giác trong:</b> DB/DC = AB/AC.</li><li><b>Tam giác đồng dạng:</b> g.g, c.g.c, c.c.c. Tỉ số đồng dạng k thì tỉ số chu vi là k, tỉ số diện tích là k².</li></ul>`],
['📊','Thống kê và xác suất',8,`<ul><li>Biểu diễn dữ liệu bằng bảng, biểu đồ cột, biểu đồ tròn, biểu đồ đoạn thẳng.</li><li><b>Xác suất thực nghiệm</b> = số lần xảy ra / tổng số lần thử.</li><li><b>Xác suất cổ điển</b> P = số kết quả thuận lợi / tổng số kết quả có thể (các kết quả đồng khả năng). 0 ≤ P ≤ 1.</li></ul><p class="tip">💡 Biến cố chắc chắn có P = 1, biến cố không thể có P = 0.</p>`],
['√','Căn bậc hai và căn bậc ba',9,`<ul><li>√A có nghĩa khi A ≥ 0. <b>√(A²) = |A|</b>.</li><li>√(AB) = √A·√B; √(A/B) = √A/√B (A, B ≥ 0).</li><li><b>Đưa thừa số ra ngoài:</b> √(a²b) = |a|√b. Ví dụ √72 = 6√2.</li><li><b>Trục căn ở mẫu:</b> 1/√a = √a/a.</li><li>Căn bậc ba: ∛(a³) = a với mọi số thực a.</li></ul><p class="tip">💡 Thử công cụ E để rút gọn căn nhanh.</p>`],
['🔗','Hệ hai phương trình bậc nhất hai ẩn',9,`<p>Hệ: a₁x + b₁y = c₁ và a₂x + b₂y = c₂.</p><ul><li><b>Phương pháp thế:</b> rút một ẩn từ phương trình này, thế vào phương trình kia.</li><li><b>Phương pháp cộng:</b> nhân hệ số cho phù hợp rồi cộng hoặc trừ hai vế.</li><li>Số nghiệm: a₁/a₂ ≠ b₁/b₂ → 1 nghiệm; a₁/a₂ = b₁/b₂ ≠ c₁/c₂ → vô nghiệm; cả ba tỉ số bằng nhau → vô số nghiệm.</li></ul><p class="tip">💡 Hệ phương trình ứng dụng trong bài toán chuyển động, năng suất, tìm hai số.</p>`],
['🧮','Phương trình bậc hai và định lí Viète',9,`<ul><li>ax² + bx + c = 0 (a ≠ 0), <b>Δ = b² − 4ac</b>.</li><li>Δ &gt; 0: hai nghiệm x = (−b ± √Δ)/(2a). Δ = 0: nghiệm kép x = −b/(2a). Δ &lt; 0: vô nghiệm.</li><li><b>Viète:</b> x₁ + x₂ = −b/a; x₁x₂ = c/a.</li><li>Nhẩm nghiệm: a + b + c = 0 thì x₁ = 1, x₂ = c/a. a − b + c = 0 thì x₁ = −1, x₂ = −c/a.</li></ul><p class="tip">💡 Kiểm tra nghiệm bằng Viète: tổng và tích phải khớp.</p>`],
